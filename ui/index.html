<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cap</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="card" id="card">
    <header id="hdr">
      <div class="brand"><img src="mark.png" alt="" /><span>Cap</span><small id="verTag"></small></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="perfBtn" data-t-tip="hdr.perf"></button>
      <button class="icon-btn" id="gearBtn" data-t-tip="hdr.settings"></button>
      <button class="icon-btn" id="minBtn" data-t-tip="hdr.minimize"></button>
      <button class="icon-btn" id="closeBtn" data-t-tip="hdr.close"></button>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="focus"><i data-i="timer"></i><span data-t="tab.focus">Focus</span></button>
      <button data-tab="dossiers"><i data-i="folder"></i><span data-t="tab.dossiers">Dossiers</span></button>
      <button data-tab="jauges"><i data-i="globe"></i><span data-t="tab.sites">Sites</span></button>
      <button data-tab="rappels" id="tabRappels"><i data-i="bell"></i><span data-t="tab.rappels">Rappels</span></button>
      <button data-tab="stats"><i data-i="chart"></i><span data-t="tab.stats">Stats</span></button>
    </nav>

    <main>
      <!-- Focus -->
      <section class="view focus-view" data-view="focus">
        <div class="ring-wrap" id="ringWrap">
          <svg viewBox="0 0 224 224">
            <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a1)" /><stop offset="1" stop-color="var(--a2)" /></linearGradient></defs>
            <circle class="ring-bg" cx="112" cy="112" r="98" />
            <circle class="ring-fg" id="ring" cx="112" cy="112" r="98" />
          </svg>
          <div class="ring-center">
            <input class="time-input" id="minInput" inputmode="numeric" maxlength="3" spellcheck="false" autocomplete="off" data-t-tip="focus.minutesTip" />
            <span class="unit" id="minUnit" data-t="focus.unit">min</span>
            <div class="time hidden" id="time"></div>
          </div>
        </div>
        <div class="ctl-row" id="idleCtl">
          <button class="round" id="minusBtn" data-t-tip="focus.minus"></button>
          <button class="round big" id="startBtn" data-t-tip="focus.start"></button>
          <button class="round" id="plusBtn" data-t-tip="focus.plus"></button>
        </div>
        <input class="focus-note hidden" id="focusNote" maxlength="160" data-t-ph="focus.notePh" spellcheck="false" autocomplete="off" data-t-tip="focus.noteTip" />
        <div class="ctl-row hidden" id="runCtl">
          <button class="round" id="plus5" data-t-tip="focus.plus5">+5</button>
          <button class="round big" id="pauseBtn" data-t-tip="focus.pause"></button>
          <button class="round" id="stopBtn" data-t-tip="focus.stop"></button>
        </div>
      </section>

      <!-- Dossiers -->
      <section class="view hidden" data-view="dossiers">
        <div class="bar-row">
          <form class="add-row" id="addDossier"><input id="dossierInput" maxlength="120" data-t-ph="dos.newPh" spellcheck="false" autocomplete="off" /><button type="submit" class="icon-btn solid" data-i="plus" data-t-tip="dos.add"></button></form>
          <button class="icon-btn" id="archBtn" title="Archives"></button>
        </div>
        <div class="board" id="board"></div>
        <div class="archives hidden" id="archives">
          <div class="seg" id="archSeg"><button data-a="done" class="sel"><i data-i="check"></i><span id="archDoneN"></span></button><button data-a="dead"><i data-i="skull"></i><span id="archDeadN"></span></button></div>
          <div class="arch-list" id="archList"></div>
        </div>
      </section>

      <!-- Jauges -->
      <section class="view hidden" data-view="jauges">
        <form class="add-row" id="addSite"><input id="siteInput" data-t-ph="site.ph" spellcheck="false" autocomplete="off" /><button type="submit" class="icon-btn solid" data-i="plus" data-t-tip="dos.add"></button></form>
        <div class="list" id="siteList"></div>
      </section>

      <!-- Rappels -->
      <section class="view hidden" data-view="rappels">
        <div class="master" id="masterRow"><i id="masterIco"></i><b data-t="rem.title">Rappels</b><span class="pill-warn hidden" id="missedTag"></span><div class="switch" id="masterSwitch"></div></div>
        <div class="row" id="missRow"><i data-i="bellOff"></i><b data-t="rem.missesToPause">Pause après</b><div class="stepper" id="missStep" data-t-tip="rem.missesTip"></div></div>
        <div class="sec-t hidden" id="pendHead" data-t-tip="rem.pendingTip"><i data-i="bell"></i><span data-t="rem.pending">En attente</span></div>
        <div class="list" id="pendList"></div>
        <div class="sec-t"><i data-i="clock"></i><span data-t="rem.once">Uniques</span></div>
        <form class="once-row" id="onceAdd">
          <input id="onceInput" maxlength="80" data-t-ph="rem.whatPh" spellcheck="false" autocomplete="off" />
          <input class="when-in" id="onceWhen" maxlength="8" data-t-ph="rem.whenPh" spellcheck="false" autocomplete="off" data-t-tip="rem.whenTip" />
          <button type="submit" class="icon-btn solid" data-i="plus" data-t-tip="rem.addOnce"></button>
        </form>
        <div class="list" id="onceList"></div>
        <div class="sec-t"><i data-i="repeat"></i><span data-t="rem.recurring">Récurrents</span></div>
        <form class="add-row small" id="addRem"><input id="remInput" maxlength="60" data-t-ph="rem.whatPh" spellcheck="false" autocomplete="off" data-t-tip="rem.addRecTip" /><button type="submit" class="icon-btn solid" data-i="plus" data-t-tip="dos.add"></button></form>
        <div class="list" id="remList"></div>
      </section>

      <!-- Stats -->
      <section class="view hidden" data-view="stats">
        <div class="seg" id="period"><button data-p="1" data-t="st.day">Jour</button><button data-p="7" class="sel" data-t="st.7d">7 j</button><button data-p="30" data-t="st.30d">30 j</button><button data-p="0" data-t="st.all">Tout</button></div>
        <div class="stats" id="stats"></div>
      </section>

      <!-- Performance -->
      <section class="view hidden" data-view="perf">
        <div class="kpis">
          <div class="kpi" data-t-tip="pf.cpuTip"><b id="pfCpu">–</b><span data-t="pf.cpu">processeur</span></div>
          <div class="kpi" data-t-tip="pf.memTip"><b id="pfMem">–</b><span data-t="pf.mem">mémoire</span></div>
          <div class="kpi" data-t-tip="pf.procsTip"><b id="pfProcs">–</b><span data-t="pf.procs">processus</span></div>
        </div>
        <div class="chart"><div class="spark-h"><span data-t="pf.cpuTitle">Processeur</span><span id="pfCpuMax"></span></div><svg class="spark" id="pfCpuSpark" viewBox="0 0 300 60" preserveAspectRatio="none"></svg></div>
        <div class="chart"><div class="spark-h"><span data-t="pf.memTitle">Mémoire</span><span id="pfMemMax"></span></div><svg class="spark" id="pfMemSpark" viewBox="0 0 300 60" preserveAspectRatio="none"></svg></div>
        <div class="about" id="pfDetails"></div>
      </section>

      <!-- Réglages -->
      <section class="view hidden" data-view="settings">
        <div class="list">
          <div class="row" id="autoRow"><i data-i="power"></i><b data-t="set.autostart">Démarrer avec Windows</b><div class="switch" id="autoSwitch"></div></div>
          <div class="row" id="soundRow"><i data-i="sound"></i><b data-t="set.sound">Son de fin de focus</b><div class="switch" id="soundSwitch"></div></div>
          <div class="row"><i data-i="folder"></i><b data-t="set.decay">Déclin des dossiers</b><div class="stepper" id="decayStep"></div></div>
          <div class="row"><i data-i="globe"></i><b data-t="set.lang">Langue</b><select class="sel" id="langSel"></select><button class="icon-btn sm" id="langImport" data-i="up" data-t-tip="set.langImport"></button><button class="icon-btn sm" id="langFolder" data-i="folder" data-t-tip="set.langFolder"></button><input type="file" id="langFile" accept=".json,application/json" hidden /></div>
          <div class="row clickable sc" data-sc="open" data-t-tip="set.scTip"><i data-i="keyboard"></i><b data-t="set.scOpen">Ouvrir / réduire</b><kbd id="scOpen"></kbd><span class="scs" id="scOpenOk"></span></div>
          <div class="row clickable sc" data-sc="quick" data-t-tip="set.scTip"><i data-i="keyboard"></i><b data-t="set.scQuick">Rappel unique</b><kbd id="scQuick"></kbd><span class="scs" id="scQuickOk"></span></div>
          <div class="sec-t"><i data-i="plug"></i><span data-t="set.browsers">Navigateurs</span><button class="icon-btn sm" id="openExt" data-i="folder" data-t-tip="set.extFolder"></button></div>
          <div class="list" id="browserList"></div>
          <div class="sec-t"><i data-i="star"></i><span data-t="set.about">À propos</span></div>
          <div class="row upd" id="updRow"><i data-i="down"></i><b id="updTxt"></b><button class="icon-btn sm" id="updBtn"></button></div>
          <div class="about" id="about"></div>
          <div class="row"><i data-i="power"></i><b data-t="set.quit">Quitter Cap</b><button class="icon-btn danger" id="quitBtn" data-i="close" data-t-tip="set.quitBtn"></button></div>
        </div>
      </section>
    </main>
    <form class="qpanel hidden" id="qpanel">
      <input id="qInput" maxlength="120" spellcheck="false" autocomplete="off" />
      <input class="when-in" id="qWhen" maxlength="8" data-t-ph="rem.whenPh" spellcheck="false" autocomplete="off" data-t-tip="rem.whenTip" />
      <button type="submit" class="icon-btn solid" data-i="plus" data-t-tip="dos.add"></button>
    </form>
    <div class="fab-wrap" id="fab">
      <div class="fab-menu" id="fabMenu">
        <button data-qa="rem" data-t-tip="qa.rem"><i data-i="bellPlus"></i></button>
        <button data-qa="dos" data-t-tip="qa.dos"><i data-i="folder"></i></button>
        <button data-qa="focus" data-t-tip="qa.focus"><i data-i="play"></i></button>
      </div>
      <button class="fab" id="fabBtn" data-t-tip="qa.open"></button>
    </div>
    <div class="picker hidden" id="picker"></div>
    <div class="tip hidden" id="tip"></div>
  </div>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
