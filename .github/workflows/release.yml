# Publier une version : python scripts/bump.py 1.4.0, puis un commit dont le message commence par « v1.4.0 », poussé sur main.
# L'action crée elle-même l'étiquette v1.4.0 et la version GitHub.
name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || startsWith(github.event.head_commit.message, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Textes (règle dure)
        run: python scripts/check_i18n.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install

      - name: Extensions (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path extension/* -DestinationPath dist/cap-extension-chromium.zip
          New-Item -ItemType Directory -Force build/ff | Out-Null
          Copy-Item -Recurse extension/* build/ff/
          Copy-Item firefox/manifest.json build/ff/manifest.json -Force
          Compress-Archive -Path build/ff/* -DestinationPath dist/cap-extension-firefox.zip

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: "Cap v__VERSION__"
          releaseBody: "Télécharge `Cap_*_x64-setup.exe` pour installer Cap. Les extensions sont dans les fichiers `cap-extension-*.zip`."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Joindre les extensions
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release upload "v$v" dist/cap-extension-chromium.zip dist/cap-extension-firefox.zip --clobber
